# Copy to .github/workflows/memory.yml in the exb-i18n-kit repo.
# Keeps the shared translation memory current: translates new English from memory/sources.json
# (on main) with a LibreTranslate container on the GitHub runner, plus Opus-MT for bs, hr, sr. Existing entries are never changed.
#
# The dictionaries live on their own branch, translation-memory (memory/<locale>.json there),
# because main is protected (changes only through pull requests) and the Action's token cannot
# push to it. The kit reads https://raw.githubusercontent.com/brianmcleer/exb-i18n-kit/translation-memory/memory.
#
# Works in batches: each pass translates at most BATCH new strings per locale, then commits and
# pushes right away. A long run that hits the time budget keeps everything it already pushed,
# and the next run (manual, weekly, or the next sources.json change) carries on from there.
name: translation memory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'        # Mondays
  push:
    branches: [main]
    paths: ['memory/sources.json']
permissions:
  contents: write
concurrency: memory
env:
  BATCH: '150'                  # new strings per locale per pass
  BUDGET_MINUTES: '300'         # stop starting new passes after this; job limit is 350
  MEM_BRANCH: translation-memory
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache LibreTranslate language models
        uses: actions/cache@v4
        with:
          path: ~/lt-models
          key: lt-models-v1
      # Docker Hub limits anonymous pulls per runner IP, so the image comes from Google's
      # Docker Hub mirror first, then Docker Hub with retries. If LibreTranslate still cannot
      # start, the run carries on with Opus-MT only instead of failing.
      - name: Start LibreTranslate
        continue-on-error: true
        run: |
          mkdir -p ~/lt-models && chmod 777 ~/lt-models
          IMG=""
          for src in mirror.gcr.io/libretranslate/libretranslate:latest libretranslate/libretranslate:latest; do
            for attempt in 1 2 3; do
              if docker pull -q "$src"; then IMG="$src"; break 2; fi
              echo "Pull of $src failed (attempt $attempt); waiting..."; sleep $((attempt * 30))
            done
          done
          if [ -z "$IMG" ]; then echo "::warning::LibreTranslate image could not be pulled; this run does bs, hr, sr only."; exit 1; fi
          docker run -d --name lt -p 5000:5000 -v ~/lt-models:/home/libretranslate/.local "$IMG"
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5000/languages > /dev/null; then echo "ready after ${i}0s"; echo "LT_OK=1" >> "$GITHUB_ENV"; exit 0; fi
            sleep 10
          done
          docker logs lt | tail -50; exit 1
      # Bosnian, Croatian and Serbian: LibreTranslate has no model for them. A small
      # LibreTranslate-compatible server (tools/opus-mt-server.py, Helsinki-NLP Opus-MT,
      # CC-BY-4.0) fills them on CPU. If it fails to start, those three are skipped this run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Opus-MT model and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: opus-mt-sh-v1
      - name: Start Opus-MT (bs, hr, sr)
        continue-on-error: true
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q transformers sentencepiece sacremoses
          nohup python tools/opus-mt-server.py --port 5001 > "$RUNNER_TEMP/opus.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5001/languages > /dev/null; then
              echo "Opus-MT ready after ${i}0s"
              curl -s -X POST http://localhost:5001/translate -H 'Content-Type: application/json' \
                -d '{"q":["Clear all drawings","Zoom to <x id=\"0\"></x>"],"source":"en","target":"bs","format":"html"}'
              echo; echo "OPUS_OK=1" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 10
          done
          tail -50 "$RUNNER_TEMP/opus.log"; exit 1
      - name: Check out the translation-memory branch
        run: |
          git config --global user.name "exb-i18n-bot"
          git config --global user.email "exb-i18n-bot@users.noreply.github.com"
          MEM_DIR="$RUNNER_TEMP/mem"
          if git ls-remote --exit-code --heads origin "$MEM_BRANCH" > /dev/null; then
            git fetch -q origin "$MEM_BRANCH"
            git worktree add -B "$MEM_BRANCH" "$MEM_DIR" "origin/$MEM_BRANCH"
          else
            echo "Creating $MEM_BRANCH from main"
            git worktree add -B "$MEM_BRANCH" "$MEM_DIR" HEAD
          fi
          mkdir -p "$MEM_DIR/memory"
      - name: Translate and commit in batches
        run: |
          MEM_DIR="$RUNNER_TEMP/mem"
          if [ "${LT_OK:-0}" != "1" ] && [ "${OPUS_OK:-0}" != "1" ]; then echo "::error::Neither LibreTranslate nor Opus-MT started; nothing to translate with."; exit 1; fi
          stop=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          pass=0
          while [ "$(date +%s)" -lt "$stop" ]; do
            pass=$((pass + 1))
            echo "::group::Pass $pass"
            if [ "${LT_OK:-0}" = "1" ]; then
              node bin/exb-i18n.js memory-build --sources memory/sources.json --out "$MEM_DIR/memory" --provider libretranslate --lt-url http://localhost:5000 --max "$BATCH"
            fi
            if [ "${OPUS_OK:-0}" = "1" ]; then
              node bin/exb-i18n.js memory-build --sources memory/sources.json --out "$MEM_DIR/memory" --provider libretranslate --lt-url http://localhost:5001 --locales bs,hr,sr --max "$BATCH" || echo "Opus-MT pass failed; bs, hr, sr skipped this pass."
            fi
            echo "::endgroup::"
            cd "$MEM_DIR"
            git add memory/*.json 2> /dev/null || true
            if git diff --cached --quiet; then echo "Memory is complete after $((pass - 1)) committed pass(es)."; exit 0; fi
            git commit -q -m "Translation memory: pass $pass ($(date -u +%Y-%m-%dT%H:%MZ))"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git ls-remote --exit-code --heads origin "$MEM_BRANCH" > /dev/null; then
                git fetch -q origin "$MEM_BRANCH"
                if ! git rebase -q "origin/$MEM_BRANCH"; then
                  git rebase --abort
                  echo "Rebase conflict on memory/*.json; stopping so nothing is overwritten." >&2
                  exit 1
                fi
              fi
              if git push -q origin "HEAD:$MEM_BRANCH"; then pushed=1; break; fi
              echo "Push of pass $pass failed (attempt $attempt); retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then echo "Could not push pass $pass to $MEM_BRANCH after five attempts" >&2; exit 1; fi
            echo "Pass $pass pushed to $MEM_BRANCH."
            cd "$GITHUB_WORKSPACE"
          done
          echo "Time budget used. Everything so far is pushed; run the workflow again to continue."
