# Copy to .github/workflows/memory.yml in the exb-i18n-kit repo.
# Keeps memory/<locale>.json current: translates new English from memory/sources.json with a
# LibreTranslate container on the GitHub runner. Existing entries are never changed.
#
# Works in batches: each pass translates at most BATCH new strings per locale, then commits and
# pushes right away. A long run that hits the time budget keeps everything it already pushed,
# and the next run (manual, weekly, or the next sources.json change) carries on from there.
name: translation memory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'        # Mondays
  push:
    branches: [main]
    paths: ['memory/sources.json']
permissions:
  contents: write
concurrency: memory
env:
  BATCH: '150'                  # new strings per locale per pass
  BUDGET_MINUTES: '300'         # stop starting new passes after this; job limit is 350
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache LibreTranslate language models
        uses: actions/cache@v4
        with:
          path: ~/lt-models
          key: lt-models-v1
      - name: Start LibreTranslate
        run: |
          mkdir -p ~/lt-models && chmod 777 ~/lt-models
          docker run -d --name lt -p 5000:5000 -v ~/lt-models:/home/libretranslate/.local libretranslate/libretranslate:latest
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5000/languages > /dev/null; then echo "ready after ${i}0s"; exit 0; fi
            sleep 10
          done
          docker logs lt | tail -50; exit 1
      - name: Translate and commit in batches
        run: |
          git config user.name "exb-i18n-bot"
          git config user.email "exb-i18n-bot@users.noreply.github.com"
          stop=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          pass=0
          while [ "$(date +%s)" -lt "$stop" ]; do
            pass=$((pass + 1))
            echo "::group::Pass $pass"
            node bin/exb-i18n.js memory-build --sources memory/sources.json --out memory --provider libretranslate --lt-url http://localhost:5000 --max "$BATCH"
            echo "::endgroup::"
            git add memory/*.json
            if git diff --cached --quiet; then echo "Memory is complete after $((pass - 1)) committed pass(es)."; exit 0; fi
            git commit -q -m "Translation memory: pass $pass ($(date -u +%Y-%m-%dT%H:%MZ))"
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch -q origin main
              if ! git rebase -q origin/main; then
                git rebase --abort
                echo "Rebase conflict on memory/*.json; stopping so nothing is overwritten." >&2
                exit 1
              fi
              if git push -q origin HEAD:main; then pushed=1; break; fi
              echo "main moved during push (attempt $attempt); retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then echo "Could not push pass $pass after five attempts" >&2; exit 1; fi
            echo "Pass $pass pushed."
          done
          echo "Time budget used. Everything so far is pushed; run the workflow again to continue."
