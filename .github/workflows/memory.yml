# Copy to .github/workflows/memory.yml in the exb-i18n-kit repo.
# Keeps memory/<locale>.json current: translates new English from memory/sources.json with a
# LibreTranslate container on the GitHub runner, then commits. Existing entries are never changed.
name: translation memory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'        # Mondays
  push:
    branches: [main]
    paths: ['memory/sources.json']
permissions:
  contents: write
concurrency: memory
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache LibreTranslate language models
        uses: actions/cache@v4
        with:
          path: ~/lt-models
          key: lt-models-v1
      - name: Start LibreTranslate
        run: |
          mkdir -p ~/lt-models && chmod 777 ~/lt-models
          docker run -d --name lt -p 5000:5000 -v ~/lt-models:/home/libretranslate/.local libretranslate/libretranslate:latest
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5000/languages > /dev/null; then echo "ready after ${i}0s"; exit 0; fi
            sleep 10
          done
          docker logs lt | tail -50; exit 1
      - name: Translate new strings
        run: node bin/exb-i18n.js memory-build --sources memory/sources.json --out memory --provider libretranslate --lt-url http://localhost:5000
      - name: Commit
        run: |
          git config user.name "exb-i18n-bot"
          git config user.email "exb-i18n-bot@users.noreply.github.com"
          git add memory/*.json
          git diff --cached --quiet && echo "No new translations" && exit 0
          git commit -m "Translation memory: new strings ($(date -u +%Y-%m-%d))"
          git push
