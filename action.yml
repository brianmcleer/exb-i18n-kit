name: 'exb-i18n'
description: 'Keep an ArcGIS Experience Builder custom widget translated in all 39 Experience Builder languages.'
author: 'Brian McLeer'
branding:
  icon: 'globe'
  color: 'blue'
inputs:
  widget:
    description: 'Path to the widget folder (the one with manifest.json), or a folder of widgets.'
    required: true
  command:
    description: 'sync (update language files), check (fail if out of date) or audit (list hardcoded English).'
    default: 'sync'
  locales:
    description: 'all, or a list such as es,fr,de'
    default: 'all'
  memory:
    description: 'true to use the shared translation memory from this repo, false to skip, or a URL/folder of your own.'
    default: 'true'
  commit:
    description: 'true to commit changed language files back to the branch (sync only).'
    default: 'false'
  commit-message:
    description: 'Commit message when commit is true.'
    default: 'Update widget translations (exb-i18n)'
runs:
  using: 'composite'
  steps:
    - name: Run exb-i18n
      shell: bash
      env:
        EXB_I18N_CACHE: ${{ runner.temp }}/exb-i18n
        INPUT_WIDGET: ${{ inputs.widget }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_LOCALES: ${{ inputs.locales }}
        INPUT_MEMORY: ${{ inputs.memory }}
      run: |
        set -euo pipefail
        case "$INPUT_COMMAND" in sync|check|audit) ;; *) echo "::error::Invalid command"; exit 1;; esac
        args=("$INPUT_COMMAND" "$INPUT_WIDGET" --locales "$INPUT_LOCALES")
        if [[ "$INPUT_MEMORY" == false ]]; then
          args+=(--no-memory)
        elif [[ "$INPUT_MEMORY" != true ]]; then
          args+=(--memory "$INPUT_MEMORY")
        fi
        if [[ "$INPUT_COMMAND" == audit ]]; then args+=(--strict); fi
        node "${{ github.action_path }}/bin/exb-i18n.js" "${args[@]}"
    - name: Commit language files
      if: ${{ inputs.commit == 'true' && inputs.command == 'sync' }}
      shell: bash
      env:
        INPUT_WIDGET: ${{ inputs.widget }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        git config user.name "exb-i18n-bot"
        git config user.email "exb-i18n-bot@users.noreply.github.com"
        git add -A -- "$INPUT_WIDGET"
        if git diff --cached --quiet; then echo "Translations already up to date"; exit 0; fi
        git commit -m "$INPUT_COMMIT_MESSAGE"
        git push
